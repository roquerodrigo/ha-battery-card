name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the card parses
        run: node --check battery-card.js

  validate:
    uses: roquerodrigo/workflows/.github/workflows/home-assistant-validate.yml@main
    with:
      hassfest: false
      version-check: false
      hacs-category: plugin

  update-pr-branch:
    if: github.event_name == 'pull_request'
    needs: [syntax, validate]
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/workflows/.github/workflows/update-pr-branch.yml@main
