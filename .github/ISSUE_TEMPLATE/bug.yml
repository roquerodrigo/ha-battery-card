name: Bug report
description: Report a problem with the card.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Before opening, search the [existing issues](https://github.com/roquerodrigo/ha-battery-card/issues?q=is%3Aissue) for the same problem.
        Report one problem per issue.
  - type: input
    id: version
    attributes:
      label: Card version
      description: As shown in HACS.
      placeholder: 1.2.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Home Assistant version, browser or app, and how the card was installed (HACS or manual).
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Card configuration
      description: The card YAML, from the card editor → Show code editor.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open the browser developer tools (F12) → Console and paste any errors.
      render: text
